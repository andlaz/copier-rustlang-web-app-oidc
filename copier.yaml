_subdirectory: template

# questions
project_name:
  type: str
  help: What is your project name?
  default: 'web-app-oidc'
  validator: |
    {% if not (project_name | regex_search('^[a-zA-Z][a-zA-Z0-9_-]*$')) %}
    Project name must start with a letter and contain only letters, digits, '-' or '_' (crates.io-style).
    {% endif %}

# The template sources are a runnable cargo project using the default name
# (web-app-oidc) so they can be type-checked and built before rendering.
# When the answer differs from the default, rename the package in the
# generated project. Files that still carry the default name:
#   - Cargo.toml / Cargo.lock  (package name)
#   - src/main.rs              (APP_NAME constant)
#   - Dockerfile               (binary path in COPY and ENTRYPOINT)
#   - README.md                (example commands and test domain)
# The replacement string is validated above (letters, digits, '-' or '_'),
# so the plain s//g pattern needs no escaping and the task is safe to run
# without a shell (cmd as a list, avoiding any shell quoting/injection).
# sed -i.bak is the portable in-place form across GNU, BSD/macOS and busybox;
# the second task removes the .bak copies it leaves behind.
_tasks:
  - when: "{{ project_name != 'web-app-oidc' }}"
    command:
      - sed
      - -i.bak
      - s/web-app-oidc/{{ project_name }}/g
      - Cargo.toml
      - Cargo.lock
      - src/main.rs
      - Dockerfile
      - README.md
  - when: "{{ project_name != 'web-app-oidc' }}"
    command:
      - rm
      - -f
      - Cargo.toml.bak
      - Cargo.lock.bak
      - src/main.rs.bak
      - Dockerfile.bak
      - README.md.bak
